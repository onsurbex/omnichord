name: macOS VST3 build and tests

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get JUCE 8.0.6
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure universal macOS build
        run: >-
          cmake -S . -B build -G Xcode
          -DJUCE_PATH="$RUNNER_TEMP/JUCE"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCHORDHARP_PLUGIN_TESTS=ON
          -DCHORDHARP_GUI_EDITOR=OFF
      - name: Build instrument and tests
        run: cmake --build build --config Release --parallel 3 --target Omnichord_VST3 Omnichord_Standalone engine_tests processor_tests
      - name: Test engine and JUCE processor
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check universal binaries and local signatures
        run: |
          lipo build/Omnichord_artefacts/Release/VST3/Omnichord.vst3/Contents/MacOS/Omnichord -verify_arch arm64 x86_64
          lipo build/Omnichord_artefacts/Release/Standalone/Omnichord.app/Contents/MacOS/Omnichord -verify_arch arm64 x86_64
          codesign --force --deep --sign - build/Omnichord_artefacts/Release/VST3/Omnichord.vst3
          codesign --force --deep --sign - build/Omnichord_artefacts/Release/Standalone/Omnichord.app
          codesign --verify --deep --strict build/Omnichord_artefacts/Release/VST3/Omnichord.vst3
          codesign --verify --deep --strict build/Omnichord_artefacts/Release/Standalone/Omnichord.app
      - name: Create macOS PKG installer
        run: bash scripts/build-macos-pkg.sh build .
      - name: Verify PKG installation and replacement
        run: |
          sudo installer -pkg Omnichord-*.pkg -target /
          sudo installer -pkg Omnichord-*.pkg -target /
          codesign --verify --deep --strict --verbose=2 /Library/Audio/Plug-Ins/VST3/Omnichord.vst3
          codesign --verify --deep --strict --verbose=2 /Applications/Omnichord.app
          lipo /Library/Audio/Plug-Ins/VST3/Omnichord.vst3/Contents/MacOS/Omnichord -verify_arch arm64 x86_64
          lipo /Applications/Omnichord.app/Contents/MacOS/Omnichord -verify_arch arm64 x86_64
          pkgutil --pkg-info audio.chordharp.instrument.pkg
      - name: Package for testing
        run: |
          mkdir -p package
          cp -R build/Omnichord_artefacts/Release/VST3/Omnichord.vst3 package/
          cp -R build/Omnichord_artefacts/Release/Standalone/Omnichord.app package/
          cp README.md package/
          cp THIRD_PARTY_NOTICES.md package/
          cp Assets/magic.xml package/
          cp build/Omnichord-preview.png package/
          cp build/Omnichord-midnight-preview.png package/
          ditto -c -k --sequesterRsrc --keepParent package Omnichord-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Omnichord-macOS-universal
          path: |
            Omnichord-*.pkg
            Omnichord-macOS-universal.zip
            build/Omnichord-preview.png
            build/Omnichord-midnight-preview.png
          if-no-files-found: error
